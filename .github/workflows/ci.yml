name: CI

on:
  push:
    branches: [main, release-2]
  pull_request:

# Spec Fase 1 §3/§9 (rede de testes): nenhuma etapa deste pipeline abre
# conexão com um banco de dados, sobe um Postgres/Docker ou executa
# `supabase start`/`supabase db reset`. Todo teste (unit e E2E) roda sobre
# fixtures em memória — ver e2e/mock-server/ e e2e/fixtures/.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes unitários (Vitest)
        run: pnpm test

      - name: Build de produção
        run: pnpm build
        env:
          # Valores fictícios: o build não abre nenhuma conexão real.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Instala o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E (Playwright contra o mock server local)
        run: pnpm test:e2e

      - name: Publica o relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
